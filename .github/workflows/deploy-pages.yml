name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website from ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="hoang-tu-lo-lem-github-pages.zip"
          test -f "$ZIP_FILE"
          echo "a164506f087b083180ff06c30f0a6e0dba92cdfb8481e1171477242e6f64a634  $ZIP_FILE" | sha256sum -c -
          unzip -t "$ZIP_FILE"
          mkdir -p _site
          unzip -q "$ZIP_FILE" -d _site
          test -f _site/index.html
          node --input-type=module --check < _site/app.js
          node --input-type=module --check < _site/tilt-controller.js
          node --input-type=module --check < _site/rewards.js
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
