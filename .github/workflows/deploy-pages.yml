name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: pages-setup

      - name: Rebuild site bundle
        shell: bash
        run: |
          cat .bootstrap/part*.txt > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          mkdir -p _site
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          node --check _site/app.js
          node --check _site/tilt-controller.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
