name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ZIP 3 website
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="hoang-tu-lo-lem-github-pages(3).zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Missing $ZIP_FILE in repository root. Upload ZIP (3) to the main branch, then this workflow will deploy it automatically."
            exit 1
          fi
          unzip -t "$ZIP_FILE"
          rm -rf _site
          mkdir -p _site
          unzip -q "$ZIP_FILE" -d _site
          test -f _site/index.html
          node --check _site/app.js
          node --check _site/tilt-controller.js
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
