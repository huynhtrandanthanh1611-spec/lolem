name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: pages-setup

      - name: Rebuild site bundle
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re

          parts = sorted(Path('.bootstrap').glob('part*.txt'))
          text = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          text = re.sub(r'\s+', '', text)
          print('parts:', [(p.name, len(p.read_text(encoding="utf-8").strip())) for p in parts])
          print('base64 length before padding:', len(text), 'mod4=', len(text) % 4)
          text += '=' * (-len(text) % 4)
          print('base64 length after padding:', len(text), 'mod4=', len(text) % 4)
          data = base64.b64decode(text, validate=True)
          Path('/tmp/site.zip').write_bytes(data)
          print('decoded bytes:', len(data), 'header:', data[:4])
          PY
          unzip -t /tmp/site.zip
          rm -rf _site
          mkdir -p _site
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
          node --check _site/app.js
          node --check _site/tilt-controller.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
